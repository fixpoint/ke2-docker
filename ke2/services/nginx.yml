services:
  nginx:
    image: registry.hub.docker.com/library/nginx:1.27-alpine
    hostname: nx-${HOSTNAME:?HOSTNAME must be set}
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - NGINX_ENVSUBST_FILTER=^KOMPIRA
      - KOMPIRA_HOST=${KOMPIRA_HOST:-kompira}
      - KOMPIRA_PORT=${KOMPIRA_PORT:-8000}
      # uwsgi の read/send タイムアウト(秒)。envsubst は ${VAR:-default} 非対応のため既定値はここで与える
      - KOMPIRA_NGINX_UWSGI_READ_TIMEOUT=${KOMPIRA_NGINX_UWSGI_READ_TIMEOUT:-300}
      - KOMPIRA_NGINX_UWSGI_SEND_TIMEOUT=${KOMPIRA_NGINX_UWSGI_SEND_TIMEOUT:-300}
    configs:
      # MEMO: /etc/nginx/templates/*.template は起動時に環境変数が展開されて /etc/nginx/conf.d/* に書き出される
      - source: nginx-config
        target: /etc/nginx/templates/default.conf.template
    volumes:
      - ${KOMPIRA_VAR_DIR:-kompira_var}:/var/opt/kompira
      - ${KOMPIRA_SSL_DIR:-../../ssl}:/etc/nginx/ssl:ro
    ports:
      - mode: ${NGINX_PORT_MODE:-ingress}
        target: 80
        published: 80
        protocol: tcp
      - mode: ${NGINX_PORT_MODE:-ingress}
        target: 443
        published: 443
        protocol: tcp
configs:
  nginx-config:
    file: ../../configs/nginx.conf
volumes:
  kompira_var:
