x-logging:
  &default-logging
  driver: local
  # options:
  #   tag: "docker.{{.Name}}"

x-single-replicated:
  &single-replicated
  mode: replicated
  replicas: 1

x-multi-replicated:
  &multi-replicated
  mode: replicated
  replicas: ${SWARM_REPLICAS:-3}
  placement:
    max_replicas_per_node: 1

# MEMO: 本構成でも外部 DB を前提とするが、DATABASE_URL の要否判定は setup_stack.sh が行なう
# (未指定なら DATABASE_HOST から既定値を組み立て、いずれも無ければエラー停止する)。
# compose ファイル側で :? による必須化を行なうと、docker stack deploy に使わない
# docker compose pull のようなコマンドまで停止するため、ここでは必須化しない。
# なお setup_stack.sh を介さずに docker compose を直接実行した場合は、../../services/*.yml の
# 既定値 (pgsql://kompira:kompira@postgres:5432/kompira) が使われる。これはイメージ取得など
# デプロイを伴わない用途を想定したもので、実デプロイは常に setup_stack.sh 経由となる。

services:
  redis:
    hostname: "re-{{.Node.Hostname}}"
    logging: *default-logging
    deploy: *single-replicated
  rabbitmq:
    hostname: "mq-{{.Node.Hostname}}"
    logging: *default-logging
    configs:
      - source: rabbitmq-config-cluster
        target: /etc/rabbitmq/conf.d/50-cluster.conf
    volumes:
      # Swarm 構成では RABBITMQ_DATA_DIR を名前付きボリュームに bind して再起動時にクラスタ再加入できるようにする
      - ${RABBITMQ_DATA_DIR:-kompira_rmq}:/var/lib/rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-SECRET_COOKIE}
      RABBITMQ_USE_LONGNAME: ${RABBITMQ_USE_LONGNAME:-false}
    deploy: *multi-replicated
  jobmngrd:
    hostname: "jm-{{.Node.Hostname}}"
    environment:
      AMQP_URL: ${AMQP_URL:-amqp://${AMQP_USER:-guest}:${AMQP_PASSWORD:-guest}@mq-<<.Node.Hostname>>:5672}
    logging: *default-logging
    deploy: *multi-replicated
  kengine:
    hostname: "ke-{{.Node.Hostname}}"
    environment:
      AMQP_URL: ${AMQP_URL:-amqp://${AMQP_USER:-guest}:${AMQP_PASSWORD:-guest}@mq-<<.Node.Hostname>>:5672}
    logging: *default-logging
    deploy: *multi-replicated
  kompira:
    hostname: "ap-{{.Node.Hostname}}"
    environment:
      AMQP_URL: ${AMQP_URL:-amqp://${AMQP_USER:-guest}:${AMQP_PASSWORD:-guest}@mq-<<.Node.Hostname>>:5672}
    logging: *default-logging
    deploy: *multi-replicated
  nginx:
    hostname: "nx-{{.Node.Hostname}}"
    logging: *default-logging
    deploy: *multi-replicated

configs:
  rabbitmq-config-cluster:
    file: ./rabbitmq-cluster.conf
volumes:
  kompira_rmq:
