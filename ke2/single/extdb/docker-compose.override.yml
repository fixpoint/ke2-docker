x-logging:
  &default-logging
  driver: local
  # options:
  #   tag: "docker.{{.Name}}"

# 外部DB構成では postgres コンテナを起動しないため、DATABASE_URL の指定を必須とする。
# compose は変数をファイル読み込み時に展開するため、未指定の場合は up だけでなく
# pull / config / down など、この構成ディレクトリで実行するすべての docker compose
# コマンドがエラーで停止する。
x-required-db-env: &required-db-env
  DATABASE_URL: '${DATABASE_URL:?DATABASE_URL must be set. It is required by every docker compose command (pull, config, up, down, ...), not only up. Recommended - write it in the .env file in this directory (e.g. DATABASE_URL=pgsql://user:password@host:5432/dbname). See Environment.md for details}'

services:
  redis:
    logging: *default-logging
    restart: always
  rabbitmq:
    logging: *default-logging
    restart: always
  jobmngrd:
    environment:
      <<: *required-db-env
    logging: *default-logging
    depends_on:
      - rabbitmq
    restart: always
  kengine:
    environment:
      <<: *required-db-env
    volumes:
      - type: bind
        source: ./.secret_key
        target: /var/opt/kompira/.secret_key
    logging: *default-logging
    depends_on:
      - redis
      - rabbitmq
    restart: always
  kompira:
    environment:
      <<: *required-db-env
    volumes:
      - type: bind
        source: ./.secret_key
        target: /var/opt/kompira/.secret_key
    logging: *default-logging
    depends_on:
      - redis
      - kengine
    restart: always
  nginx:
    logging: *default-logging
    depends_on:
      - kompira
    restart: always
